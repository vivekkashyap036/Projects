# CI for the HR assistant: run the offline test suite, then build the Docker image and
# validate the Kubernetes manifests. Runs only when files in hr-knowledge-assistant/ change.
name: hr-assistant-ci

on:
  push:
    paths: ["hr-knowledge-assistant/**", ".github/workflows/hr-assistant-ci.yml"]
  pull_request:
    paths: ["hr-knowledge-assistant/**"]

defaults:
  run:
    working-directory: hr-knowledge-assistant

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hr-knowledge-assistant/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Offline retrieval evaluation
        run: python -m app.ingest && python -m eval.evaluate
        env:
          EMBEDDING_PROVIDER: hash
          LLM_PROVIDER: mock
          RELEVANCE_THRESHOLD: "0.1"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t hr-assistant:${{ github.sha }} .
      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          kubectl kustomize k8s/ | ./kubeconform -strict -summary -
          ./kubeconform -strict -summary k8s/60-eval-job.yaml
