# Local "production-like" stack:  docker compose up --build
#   UI  -> http://localhost:8501      API docs -> http://localhost:8000/docs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr-password
      POSTGRES_DB: hr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr"]
      interval: 5s
      retries: 10

  api:
    build: .
    image: hr-assistant:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hr:hr-password@postgres:5432/hr
      CHROMA_DIR: /app/storage/chroma
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    image: hr-assistant:latest
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  pgdata:
