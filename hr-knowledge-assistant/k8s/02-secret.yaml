# DEMO ONLY. Secrets are just base64-encoded, not encrypted, so never commit real values.
# In production, use Azure Key Vault / AWS Secrets Manager via the External Secrets Operator,
# or Sealed Secrets, and enable encryption at rest for etcd.
#
# Add your LLM key without editing this file:
#   kubectl -n hr-assistant create secret generic hr-secrets \
#     --from-literal=POSTGRES_PASSWORD=hr-password --from-literal=GROQ_API_KEY=gsk_... \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: hr-secrets
  namespace: hr-assistant
type: Opaque
stringData:
  POSTGRES_PASSWORD: "hr-password"
  GROQ_API_KEY: ""
  OPENAI_API_KEY: ""
  GOOGLE_API_KEY: ""
