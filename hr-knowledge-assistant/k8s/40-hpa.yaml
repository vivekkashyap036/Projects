# Horizontal Pod Autoscaler: adds/removes hr-api pods to keep average CPU near 70% of the *request*.
# Needs metrics-server (scripts/k8s-up.sh installs it). Check with: kubectl -n hr-assistant get hpa
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hr-api
  namespace: hr-assistant
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hr-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120   # avoid flapping
